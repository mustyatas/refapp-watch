name: RefAppWatch
options:
  bundleIdPrefix: com.refapp
  deploymentTarget:
    watchOS: "10.0"
settings:
  base:
    SWIFT_VERSION: 6.0
    DEVELOPMENT_TEAM: ""
packages:
  RefAppWatchCore:
    path: .
targets:
  RefAppWatch:
    type: application
    platform: watchOS
    sources: App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.refapp.referee.watchkitapp
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGNING_ALLOWED: NO
    dependencies:
      - package: RefAppWatchCore
    scheme:
      testTargets:
        - RefAppWatchCoreTests
  RefAppWatchCoreTests:
    type: bundle.unit-test
    platform: watchOS
    sources: Tests/RefAppWatchCoreTests
    dependencies:
      - package: RefAppWatchCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
